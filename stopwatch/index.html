<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" Z>
    <title>Stopwatch</title>
</head>

<body>
    <div>
        <h1 id="timer" style="text-align: center;">Timer not started yet..!😝</h1>
        <div style="display: flex; gap: 20px; justify-content: center;">
            <button onclick="stopwatch.stop()" style="background-color: red; border-radius: 5px; padding: 2px 6px; color:white; border: 0;">STOP</button>
            <button onclick="stopwatch.reset()" style="background-color: rgb(219, 191, 138); border-radius: 5px; padding: 2px 6px; color:white; border: 0;">RESET</button>
            <button onclick="stopwatch.start()" style="background-color: green; border-radius: 5px; padding: 2px 6px; color:white; border: 0;">START</button>
        </div>
    </div>
</body>
<script src="index.js">

</script>
</html>
